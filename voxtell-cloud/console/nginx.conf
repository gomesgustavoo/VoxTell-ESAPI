# nginx config for the VoxTell console SPA.
# Runs as uid 101 with a read-only root filesystem, so every temp path is
# redirected under /var/cache/nginx (an emptyDir). Listens on 8080; the
# Service maps 80 -> 8080.
worker_processes 1;
pid /var/run/nginx.pid;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types
    text/css
    text/plain
    application/javascript
    application/json
    image/svg+xml
    font/woff2;

  # Writable temp paths under emptyDir mounts (readOnlyRootFilesystem pod).
  client_body_temp_path /var/cache/nginx/client_temp;
  proxy_temp_path       /var/cache/nginx/proxy_temp;
  fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
  uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
  scgi_temp_path        /var/cache/nginx/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed, immutable assets (Vite emits content-hashed filenames).
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # OIDC silent-renew iframe target — never cache.
    location = /silent-renew.html {
      add_header Cache-Control "no-store";
      try_files $uri =404;
    }

    # SPA fallback — every unknown route serves index.html (always revalidate).
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ /index.html;
    }
  }
}
