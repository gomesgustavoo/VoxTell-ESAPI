# nginx config for the VoxTell console SPA.
# Runs as uid 101 with a read-only root filesystem, so every temp path is
# redirected under /var/cache/nginx (an emptyDir). Listens on 8080; the
# Service maps 80 -> 8080.
worker_processes 1;
pid /var/run/nginx.pid;

events {
  worker_connections 256;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_types
    text/css
    text/plain
    application/javascript
    application/json
    image/svg+xml
    font/woff2;

  # Writable temp paths under emptyDir mounts (readOnlyRootFilesystem pod).
  client_body_temp_path /var/cache/nginx/client_temp;
  proxy_temp_path       /var/cache/nginx/proxy_temp;
  fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
  uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
  scgi_temp_path        /var/cache/nginx/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Everything lives under /dashboard/ so that `/` on this hostname can be the
    # marketing landing page (a separate Service). The Dockerfile copies dist into
    # html/dashboard/, so every path below is a REAL file on disk — no `alias`, which
    # interacts badly with try_files.
    #
    # Vite's `base: "/dashboard/"` makes index.html reference /dashboard/assets/…,
    # so these locations and that base must be changed together or the SPA 404s.

    # Hashed, immutable assets (Vite emits content-hashed filenames).
    location /dashboard/assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # OIDC silent-renew iframe target — never cache.
    location = /dashboard/silent-renew.html {
      add_header Cache-Control "no-store";
      try_files $uri =404;
    }

    # SPA fallback — every unknown route under /dashboard serves the app shell. This is
    # what makes /dashboard/auth/callback work: it is a client-side route, not a file.
    location /dashboard/ {
      add_header Cache-Control "no-cache";
      # The signed-in app is not a search surface; the landing page owns SEO.
      add_header X-Robots-Tag "noindex, nofollow";
      try_files $uri $uri/ /dashboard/index.html;
    }

    # Anything outside /dashboard/ never reaches this Service through the Ingress. If
    # it does (a direct in-cluster call, a probe), send it to the app rather than
    # serving a bare 404 — but do not SPA-fallback the whole origin, or a typo in the
    # Ingress would silently shadow the landing page instead of failing loudly.
    location = / {
      return 302 /dashboard/;
    }
  }
}
