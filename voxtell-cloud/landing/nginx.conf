# VoxTell landing — full nginx config (not a snippet), cloned in shape from
# dicomsegvr/landing/nginx.conf.
#
# Runs readOnlyRootFilesystem as uid 101, so every temp path is redirected under
# /var/cache/nginx and the pid under /var/run — both emptyDir mounts in
# 86-voxtell-landing.yaml. Removing either mount breaks startup, not just caching.
#
# Security headers come from the Traefik middleware chain
# (voxtell-security-headers-sameorigin + voxtell-rate-limit), not from here, so
# there is deliberately no duplicate set below.

worker_processes 1;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
  worker_connections 256;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  access_log off;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  client_body_temp_path /var/cache/nginx/client_temp;
  proxy_temp_path       /var/cache/nginx/proxy_temp;
  fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
  uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
  scgi_temp_path        /var/cache/nginx/scgi_temp;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 256;
  gzip_vary on;
  # application/json matters here: prompts.v1.json is 359 KB raw and 68 KB gzipped,
  # and it is the largest thing this page ever fetches.
  gzip_types text/plain text/css application/javascript application/json
             application/ld+json image/svg+xml font/woff2;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Content-hash-free but path-versioned: styles.v2.css, main.v2.js, hero.v2.js,
    # hero-slice.v2.webp. Immutable is safe precisely BECAUSE the integer in the
    # filename is bumped on every change — Cloudflare's Free-plan 4-hour Browser
    # Cache TTL overrides any origin header, so a new URL is the only real bust.
    location /assets/ {
      expires 1y;
      add_header Cache-Control "public, immutable";
      try_files $uri =404;
    }

    # The plugin zip. Deliberately OUTSIDE /assets/, because immutable-1y would pin
    # a stale build: Eclipse approves by version AND content hash, so a swapped-in
    # release must be picked up on the next request.
    #
    # SCOPED TO .zip BY REGEX, not to the whole /download/ prefix. A prefix block here
    # also captured download/releases.json and served it as application/zip with
    # Content-Disposition: attachment, so the machine-readable manifest downloaded as a
    # file instead of rendering — and a future GET /v1/releases/latest reading it would
    # have been fine while every human following the link got a save dialog. Regex
    # locations beat prefix locations, so releases.json falls through to `location /`
    # and keeps its real JSON type. No `types` override is needed: nginx's stock
    # mime.types already maps .zip to application/zip.
    location ~* ^/download/.+\.zip$ {
      add_header Cache-Control "no-cache";
      add_header Content-Disposition "attachment";
      gzip off;                 # a zip is already compressed
      try_files $uri =404;
    }

    # Marketing pages: always revalidate. No SPA fallback here — an unknown path is
    # a genuine 404, unlike the console at /dashboard/.
    location / {
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ =404;
    }
  }
}
